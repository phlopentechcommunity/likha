# Template only. Create the real Secret through External Secrets or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: likha-secrets
  namespace: likha
type: Opaque
stringData:
  DATABASE_URL: postgresql://likha:REPLACE@postgresql.example:5432/likha
  REDIS_URL: redis://redis.example:6379
  INTERNAL_API_TOKEN: REPLACE_WITH_RANDOM_TOKEN
  GITHUB_API_TOKEN: REPLACE_WITH_GITHUB_APP_INSTALLATION_TOKEN
