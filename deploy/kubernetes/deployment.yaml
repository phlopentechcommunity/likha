apiVersion: apps/v1
kind: Deployment
metadata:
  name: likha-web
  namespace: likha
spec:
  replicas: 2
  selector:
    matchLabels: { app: likha-web }
  template:
    metadata:
      labels: { app: likha-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/phlopentech/likha-web:0.1.0
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: likha-config}
            - secretRef: {name: likha-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
