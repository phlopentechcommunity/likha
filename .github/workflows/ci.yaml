name: LIKHA CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/likha?schema=public
          DIRECT_URL: postgresql://user:pass@localhost:5432/likha?schema=public
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
